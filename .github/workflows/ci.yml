name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: ruff + pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tooling
        run: python -m pip install --upgrade pip ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

  smoke-test:
    name: server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sample files load
        run: |
          python - <<'PY'
          import pathlib
          samples = sorted(pathlib.Path("samples").glob("*.txt"))
          assert len(samples) == 3, f"expected 3 samples, found {len(samples)}"
          for s in samples:
              text = s.read_text(encoding="utf-8")
              assert text.strip(), f"{s} is empty"
          print("OK: 3 samples load:", [s.name for s in samples])
          PY

      - name: Start server and POST a sample to /extract
        run: |
          python -m docextract.server --port 8000 &
          SERVER_PID=$!
          # Wait for the server to accept connections.
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1)
                  break
              except Exception:
                  time.sleep(0.2)
          else:
              raise SystemExit("server did not start")
          print("server is up")
          PY
          # POST the invoice sample and assert the JSON contract.
          python - <<'PY'
          import json, pathlib, urllib.request
          text = pathlib.Path("samples/invoice.txt").read_text(encoding="utf-8")
          body = json.dumps({"text": text}).encode("utf-8")
          req = urllib.request.Request(
              "http://127.0.0.1:8000/extract",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          result = json.loads(urllib.request.urlopen(req, timeout=5).read())
          assert result["doc_type"] == "invoice", result["doc_type"]
          assert len(result["line_items"]) == 3, result["line_items"]
          assert result["totals"]["validated"] is True, result["totals"]
          assert 0.0 <= result["confidence"] <= 1.0
          assert result["trace"], "trace must not be empty"
          print("OK: /extract returned valid JSON, confidence =", result["confidence"])
          PY
          kill $SERVER_PID
